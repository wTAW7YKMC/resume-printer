<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Becky's Resume</title>
    <link rel="stylesheet" href="css/style.css?v=20250517">
    <style>
        .login-form {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fffef9;
            border-left: 4px solid #8b4513;
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .login-form h2 {
            font-family: 'Special Elite', 'Courier New', monospace;
            color: #8b4513;
            margin-bottom: 25px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            font-family: 'Special Elite', 'Courier New', monospace;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #a67c52;
            background-color: #f5f1e6;
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8b4513;
            box-shadow: 0 0 5px rgba(139, 69, 19, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #8b4513;
            color: #fffef9;
            border: none;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #6d360f;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(139, 69, 19, 0.3);
        }

        .error-message {
            background-color: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 3px;
            text-align: center;
            display: none;
            font-family: 'Courier Prime', monospace;
        }

        .credentials-hint {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #d4c4a8;
            color: #a67c52;
            font-size: 13px;
            font-family: 'Courier Prime', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 打字机机身装饰 -->
        <div class="typewriter-body">
            <div class="typewriter-roller"></div>
        </div>

        <!-- 纸张区域 -->
        <div class="paper-container">
            <!-- 标题区域 -->
            <header class="header">
                <h1 class="main-title">
                    🔐 系统登录<span class="cursor">|</span>
                </h1>
                <p style="text-align: center; color: #a67c52; margin-top: 10px; font-family: 'Special Elite', monospace;">
                    请输入用户名和密码访问系统
                </p>
            </header>

            <!-- 登录表单 -->
            <main class="content-area">
                <div id="errorMsg" class="error-message"></div>

                <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
                    <h2>🔑 用户认证</h2>

                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
                    </div>

                    <button type="submit" class="login-btn">登 录</button>

                    <div class="credentials-hint">
                        测试账号：admin / admin123
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            console.log('[LoginAction] === 用户登录请求 ===');
            console.log(`[LoginAction] 用户名: ${username}`);

            // 验证用户名和密码
            if (username === 'admin' && password === 'admin123') {
                console.log('[LoginAction] ✅ 验证成功');

                // 创建Session
                const sessionId = 'SESSION_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                const loginTime = new Date().toISOString();

                sessionStorage.setItem('currentUser', username);
                sessionStorage.setItem('loginTime', loginTime);
                sessionStorage.setItem('sessionId', sessionId);

                console.log(`[LoginAction] Session已创建: ${sessionId}`);
                console.log(`[LoginAction] 登录时间: ${loginTime}`);

                alert('✅ 登录成功！\n\n正在跳转到主页...');

                // 跳转到主页（带参数跳过开屏页面）
                window.location.href = 'index.html?showSplash=false';

            } else {
                console.log('[LoginAction] ❌ 验证失败：用户名或密码错误');

                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '❌ 用户名或密码错误，请重试！';

                // 清空密码框
                document.getElementById('password').value = '';

                // 3秒后隐藏错误信息
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        }

        // 检查是否已经登录
        window.onload = function() {
            const currentUser = sessionStorage.getItem('currentUser');

            if (currentUser) {
                console.log(`[LoginInterceptor] 检测到用户已登录: ${currentUser}`);
                console.log('[LoginInterceptor] 重定向到主页...');

                // 如果已登录，直接跳转
                window.location.href = 'index.html?showSplash=false';
            } else {
                console.log('[LoginInterceptor] 用户未登录，显示登录表单');
            }
        };
    </script>
</body>
</html>
