<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Becky's Resume</title>
    <link rel="stylesheet" href="css/style.css?v=20250517">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap"></noscript>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Courier Prime', monospace;
            background-color: #3e2723;
            color: #212121;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            padding: 0;
            position: relative;
        }

        .typewriter-body {
            background-color: #3e2723;
            height: 30px;
            border-radius: 5px 5px 0 0;
            position: relative;
            margin-bottom: 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .typewriter-roller {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 10px;
            height: 10px;
            background-color: #555;
            border-radius: 50%;
        }

        .paper-container {
            background-color: #f5f1e6;
            position: relative;
            padding: 40px;
            border-radius: 0 0 5px 5px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            min-height: auto;

            background-image: linear-gradient(rgba(139, 69, 19, 0.1) 1px, transparent 1px);
            background-size: 100% 24px;

            filter: contrast(105%) brightness(95%);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #a67c52;
        }

        .main-title {
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 48px;
            color: #8b4513;
            display: inline-block;
            position: relative;
        }

        .cursor {
            animation: blink 1s step-end infinite;
            color: #8b4513;
            font-weight: bold;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .login-subtitle {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            color: #a67c52;
            margin-top: 8px;
        }

        .content-area {
            display: flex;
            justify-content: center;
        }

        .login-form-area {
            background-color: #fffef9;
            border-left: 4px solid #8b4513;
            padding: 22px 30px;
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(139, 69, 19, 0.1);
            width: 100%;
            max-width: 420px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #a67c52;
            background-color: #f5f1e6;
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            border-radius: 3px;
            transition: all 0.3s ease;
            color: #333;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8b4513;
            box-shadow: 0 0 6px rgba(139, 69, 19, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #e8dcc8;
            border: 2px solid #a67c52;
            color: #333;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            letter-spacing: 2px;
            margin-top: 5px;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
        }

        .login-btn:hover {
            background-color: #d4b89a;
            transform: translateY(-2px);
            box-shadow: 0 5px 8px rgba(0, 0, 0, 0.2);
        }

        .guest-btn {
            width: 100%;
            padding: 12px;
            background-color: #e8dcc8;
            border: 2px solid #a67c52;
            color: #333;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            letter-spacing: 2px;
            margin-top: 10px;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
        }

        .guest-btn:hover {
            background-color: #d4b89a;
            transform: translateY(-2px);
            box-shadow: 0 5px 8px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            background-color: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 3px;
            text-align: center;
            display: none;
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="typewriter-body">
            <div class="typewriter-roller"></div>
        </div>

        <div class="paper-container">
            <header class="header">
                <h1 id="main-title" class="main-title">
                    <span id="title-text"></span><span class="cursor">|</span>
                </h1>
                <p class="login-subtitle">请输入用户名和密码访问系统</p>
            </header>

            <main class="content-area">
                <div id="errorMsg" class="error-message"></div>

                <form id="loginForm" class="login-form-area" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
                    </div>

                    <button type="submit" class="login-btn">登 录</button>

                    <button type="button" class="guest-btn" onclick="handleGuestLogin()">游客浏览</button>
                </form>
            </main>
        </div>
    </div>

    <script>
        const titleText = "Becky's Resume";
        let charIndex = 0;

        function typeTitle() {
            if (charIndex < titleText.length) {
                document.getElementById('title-text').textContent += titleText.charAt(charIndex);
                charIndex++;
                setTimeout(typeTitle, 80);
            }
        }

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            console.log('[LoginAction] === 用户登录请求 ===');
            console.log(`[LoginAction] 用户名: ${username}`);

            if (username === 'admin' && password === 'admin123') {
                console.log('[LoginAction] ✅ 验证成功');

                const sessionId = 'SESSION_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                const loginTime = new Date().toISOString();

                sessionStorage.setItem('currentUser', username);
                sessionStorage.setItem('loginTime', loginTime);
                sessionStorage.setItem('sessionId', sessionId);

                console.log(`[LoginAction] Session已创建: ${sessionId}`);
                console.log(`[LoginAction] 登录时间: ${loginTime}`);

                window.location.href = 'index.html?showSplash=false';

            } else {
                console.log('[LoginAction] ❌ 验证失败：用户名或密码错误');

                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '❌ 用户名或密码错误，请重新输入！';

                document.getElementById('password').value = '';
                document.getElementById('password').focus();

                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 4000);
            }
        }

        function handleGuestLogin() {
            console.log('[GuestLogin] === 游客登录请求 ===');

            const sessionId = 'GUEST_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const loginTime = new Date().toISOString();

            sessionStorage.setItem('currentUser', 'guest');
            sessionStorage.setItem('loginTime', loginTime);
            sessionStorage.setItem('sessionId', sessionId);
            sessionStorage.setItem('userType', 'guest');

            console.log(`[GuestLogin] ✅ 游客Session已创建: ${sessionId}`);
            console.log(`[GuestLogin] 登录时间: ${loginTime}`);

            window.location.href = 'index.html?showSplash=false';
        }

        window.onload = function() {
            typeTitle();

            const currentUser = sessionStorage.getItem('currentUser');

            if (currentUser) {
                console.log(`[LoginInterceptor] 检测到用户已登录: ${currentUser}`);
                window.location.href = 'index.html?showSplash=false';
            } else {
                setTimeout(() => {
                    document.getElementById('username').focus();
                }, 500);
            }
        };
    </script>
</body>
</html>
