<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Becky's Resume</title>
    <link rel="stylesheet" href="css/style.css?v=20250517">
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap"></noscript>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            margin: 0;
        }

        .paper-container {
            min-height: auto;
            padding: 50px 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #a67c52;
        }

        .main-title {
            font-size: 48px;
        }

        .login-subtitle {
            font-family: 'Courier Prime', monospace;
            font-size: 15px;
            color: #a67c52;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .login-form-area {
            background-color: #fffef9;
            border-left: 4px solid #8b4513;
            padding: 30px;
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(139, 69, 19, 0.1);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 13px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #a67c52;
            background-color: #f5f1e6;
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            border-radius: 3px;
            transition: all 0.3s ease;
            color: #333;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8b4513;
            box-shadow: 0 0 8px rgba(139, 69, 19, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background-color: #8b4513;
            color: #fffef9;
            border: none;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .login-btn:hover {
            background-color: #6d360f;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(139, 69, 19, 0.3);
        }

        .error-message {
            background-color: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 14px;
            margin-bottom: 18px;
            border-radius: 3px;
            text-align: center;
            display: none;
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .typewriter-keys {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 10;
        }

        .key {
            width: 20px;
            height: 20px;
            background-color: #d4c4a8;
            border: 1px solid #a67c52;
            border-radius: 3px;
            animation: keyPress 2s infinite;
        }

        .key:nth-child(2) { animation-delay: 0.2s; }
        .key:nth-child(3) { animation-delay: 0.4s; }
        .key:nth-child(4) { animation-delay: 0.6s; }
        .key:nth-child(5) { animation-delay: 0.8s; }

        @keyframes keyPress {
            0%, 90%, 100% { transform: translateY(0); }
            95% { transform: translateY(3px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="typewriter-body">
            <div class="typewriter-roller"></div>
            <div class="typewriter-keys">
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
            </div>
        </div>

        <div class="paper-container">
            <header class="header login-header">
                <h1 id="main-title" class="main-title">
                    <span id="title-text"></span><span class="cursor">|</span>
                </h1>
                <p class="login-subtitle">请输入用户名和密码访问系统</p>
            </header>

            <main class="content-area">
                <div id="errorMsg" class="error-message"></div>

                <form id="loginForm" class="login-form-area" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
                    </div>

                    <button type="submit" class="login-btn">登 录</button>
                </form>
            </main>
        </div>
    </div>

    <script>
        const titleText = "Becky's Resume";
        let charIndex = 0;

        function typeTitle() {
            if (charIndex < titleText.length) {
                document.getElementById('title-text').textContent += titleText.charAt(charIndex);
                charIndex++;
                setTimeout(typeTitle, 80);
            }
        }

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            console.log('[LoginAction] === 用户登录请求 ===');
            console.log(`[LoginAction] 用户名: ${username}`);

            if (username === 'admin' && password === 'admin123') {
                console.log('[LoginAction] ✅ 验证成功');

                const sessionId = 'SESSION_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                const loginTime = new Date().toISOString();

                sessionStorage.setItem('currentUser', username);
                sessionStorage.setItem('loginTime', loginTime);
                sessionStorage.setItem('sessionId', sessionId);

                console.log(`[LoginAction] Session已创建: ${sessionId}`);
                console.log(`[LoginAction] 登录时间: ${loginTime}`);

                window.location.href = 'index.html?showSplash=false';

            } else {
                console.log('[LoginAction] ❌ 验证失败：用户名或密码错误');

                errorMsg.style.display = 'block';
                errorMsg.innerHTML = '❌ 用户名或密码错误，请重新输入！';

                document.getElementById('password').value = '';
                document.getElementById('password').focus();

                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 4000);
            }
        }

        window.onload = function() {
            typeTitle();

            const currentUser = sessionStorage.getItem('currentUser');

            if (currentUser) {
                console.log(`[LoginInterceptor] 检测到用户已登录: ${currentUser}`);
                window.location.href = 'index.html?showSplash=false';
            } else {
                setTimeout(() => {
                    document.getElementById('username').focus();
                }, 500);
            }
        };
    </script>
</body>
</html>
