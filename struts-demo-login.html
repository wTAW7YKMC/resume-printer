<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Printer - 登录（Struts2演示）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Courier Prime', monospace;
            background-color: #3e2723;
            color: #212121;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 600px;
            width: 90%;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typewriter-body {
            background-color: #3e2723;
            height: 40px;
            border-radius: 5px 5px 0 0;
            position: relative;
            margin-bottom: 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .typewriter-roller {
            position: absolute;
            left: 15px;
            top: 15px;
            width: 10px;
            height: 10px;
            background-color: #555;
            border-radius: 50%;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .typewriter-keys {
            display: flex;
            gap: 5px;
            margin-left: auto;
            margin-right: 15px;
        }

        .key {
            width: 12px;
            height: 12px;
            background-color: #8b7355;
            border-radius: 2px;
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.2);
            animation: keyPress 3s ease-in-out infinite;
        }

        .key:nth-child(2) { animation-delay: 0.2s; }
        .key:nth-child(3) { animation-delay: 0.4s; }
        .key:nth-child(4) { animation-delay: 0.6s; }
        .key:nth-child(5) { animation-delay: 0.8s; }
        .key:nth-child(6) { animation-delay: 1s; }
        .key:nth-child(7) { animation-delay: 1.2s; }
        .key:nth-child(8) { animation-delay: 1.4s; }
        .key:nth-child(9) { animation-delay: 1.6s; }
        .key:nth-child(10) { animation-delay: 1.8s; }

        @keyframes keyPress {
            0%, 90%, 100% { transform: translateY(0); }
            95% { transform: translateY(2px); background-color: #a68b5b; }
        }

        .paper-container {
            background-color: #f5f1e6;
            position: relative;
            padding: 50px 40px;
            border-radius: 0 0 5px 5px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            min-height: 550px;

            background-image: linear-gradient(rgba(139, 69, 19, 0.1) 1px, transparent 1px);
            background-size: 100% 24px;

            filter: contrast(105%) brightness(95%);

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .main-title {
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 36px;
            color: #8b4513;
            margin-bottom: 15px;
            display: inline-block;
            position: relative;
        }

        .subtitle {
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 16px;
            color: #a67c52;
            margin-top: 10px;
        }

        .cursor {
            animation: blink 1s step-end infinite;
            color: #8b4513;
            font-weight: bold;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .login-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .login-form {
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }

        .login-form.active {
            display: block;
        }

        .form-container {
            width: 100%;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 14px;
            color: #8b4513;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #a67c52;
            background-color: #fffef9;
            font-family: 'Courier New', 'Courier Prime', monospace;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: #8b4513;
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        .error-message {
            background-color: #fff0f0;
            border: 2px solid #cc0000;
            color: #cc0000;
            padding: 15px 20px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Special Elite', 'Courier New', monospace;
            border-radius: 3px;
            display: none;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .success-message {
            background-color: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            padding: 15px 20px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Special Elite', 'Courier New', monospace;
            border-radius: 3px;
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px 30px;
            background-color: #8b4513;
            color: #fffef9;
            border: none;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            border-radius: 3px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #6d360f;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(139, 69, 19, 0.3);
        }

        .submit-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hint {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8dcc8;
            border-left: 4px solid #8b4513;
            font-size: 13px;
            color: #654321;
            line-height: 1.6;
            font-family: 'Special Elite', 'Courier New', monospace;
        }

        .hint strong {
            color: #8b4513;
        }

        .log-console {
            margin-top: 25px;
            background-color: #1e1e1e;
            border: 2px solid #333;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #00ff00;
            display: none;
            border-radius: 3px;
        }

        .log-line {
            margin: 5px 0;
            padding: 3px 0;
            border-bottom: 1px solid #333;
        }

        .log-time {
            color: #888;
        }

        .log-info {
            color: #00ff00;
        }

        .log-warn {
            color: #ffff00;
        }

        .log-error {
            color: #ff0000;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #d4c4a8;
        }

        .footer-text {
            font-size: 12px;
            color: #a67c52;
            font-family: 'Special Elite', 'Courier New', monospace;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #8b4513;
            color: #fffef9;
            padding: 10px 20px;
            text-decoration: none;
            font-family: inherit;
            font-size: 14px;
            border: 2px solid #6d360f;
            transition: all 0.3s ease;
            z-index: 1000;
            border-radius: 3px;
            font-weight: bold;
        }

        .back-link:hover {
            background-color: #6d360f;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(139, 69, 19, 0.3);
        }

        .demo-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #ff6b35;
            color: white;
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            z-index: 1000;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <a href="struts-demo.html" class="back-link">← 返回主页</a>
    <div class="demo-badge">DEMO</div>

    <div class="login-container">
        <!-- 打字机机身装饰 -->
        <div class="typewriter-body">
            <div class="typewriter-roller"></div>
            <div class="typewriter-keys">
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
                <div class="key"></div>
            </div>
        </div>

        <!-- 纸张区域 -->
        <div class="paper-container">
            <!-- 标题区域 -->
            <header class="header">
                <h1 id="main-title" class="main-title">
                    <span id="title-text">Welcome Back</span><span class="cursor">|</span>
                </h1>
                <p class="subtitle">请输入您的用户名和密码登录系统</p>
            </header>

            <!-- 登录表单区域 -->
            <main class="login-content">
                <div id="errorMsg" class="error-message"></div>
                <div id="successMsg" class="success-message"></div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div id="email-login" class="login-form active">
                        <div class="form-container">
                            <div class="input-group">
                                <label for="username" class="input-label">👤 用户名</label>
                                <input type="text"
                                       id="username"
                                       name="username"
                                       class="input-field"
                                       placeholder="请输入用户名"
                                       required
                                       autocomplete="off">
                            </div>

                            <div class="input-group">
                                <label for="password" class="input-label">🔐 密码</label>
                                <input type="password"
                                       id="password"
                                       name="password"
                                       class="input-field"
                                       placeholder="请输入密码"
                                       required>
                            </div>

                            <button type="submit" id="submitBtn" class="submit-btn">
                                登 录 →
                            </button>
                        </div>
                    </div>
                </form>

                <!-- 测试账号提示 -->
                <div class="hint">
                    <strong>📝 测试账号：</strong><br/>
                    用户名：admin &nbsp;|&nbsp; 密码：admin123<br/><br/>
                    <em>💡 提示：输入错误凭证查看错误提示效果</em>
                </div>
            </main>

            <!-- 日志控制台 -->
            <div id="logConsole" class="log-console"></div>

            <div style="margin-top: 15px; text-align: center;">
                <button onclick="toggleLogConsole()" style="
                    background: transparent;
                    border: 1px solid #a67c52;
                    color: #8b4513;
                    padding: 5px 15px;
                    cursor: pointer;
                    font-family: inherit;
                    font-size: 12px;
                    border-radius: 3px;
                ">📋 显示/隐藏日志控制台</button>
            </div>

            <!-- 页脚信息 -->
            <footer class="login-footer">
                <p class="footer-text">Resume Printer © 2026 | Struts2 权限控制系统</p>
            </footer>
        </div>
    </div>

    <script>
        const VALID_USERNAME = 'admin';
        const VALID_PASSWORD = 'admin123';

        let showLog = false;

        function toggleLogConsole() {
            const consoleEl = document.getElementById('logConsole');
            showLog = !showLog;
            consoleEl.style.display = showLog ? 'block' : 'none';
            if (showLog) {
                addLog('INFO', '日志控制台已开启');
            }
        }

        function addLog(level, message) {
            if (!showLog) return;

            const consoleEl = document.getElementById('logConsole');
            const time = new Date().toLocaleTimeString();
            const logLine = document.createElement('div');
            logLine.className = 'log-line';
            logLine.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${level.toLowerCase()}">[${level}]</span> ${message}`;
            consoleEl.appendChild(logLine);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsgEl = document.getElementById('errorMsg');
            const successMsgEl = document.getElementById('successMsg');
            const submitBtn = document.getElementById('submitBtn');

            errorMsgEl.style.display = 'none';
            successMsgEl.style.display = 'none';

            addLog('INFO', '=== 用户登录请求 ===');
            addLog('INFO', `尝试登录的用户名: ${username}`);

            submitBtn.disabled = true;
            submitBtn.textContent = '验证中...';

            setTimeout(() => {
                if (!username) {
                    addLog('WARN', '用户名为空');
                    showError('请输入用户名');
                    resetButton();
                    return;
                }

                if (!password) {
                    addLog('WARN', '密码为空');
                    showError('请输入密码');
                    resetButton();
                    return;
                }

                addLog('INFO', '正在验证用户凭证...');

                setTimeout(() => {
                    if (validateCredentials(username, password)) {
                        addLog('INFO', `✅ 用户 ${username} 登录成功`);

                        sessionStorage.setItem('currentUser', username);
                        sessionStorage.setItem('loginTime', new Date().toISOString());
                        sessionStorage.setItem('sessionId', generateSessionId());

                        addLog('INFO', `Session已创建，ID: ${sessionStorage.getItem('sessionId')}`);

                        successMsg.textContent = '🎉 登录成功！正在跳转到欢迎页面...';
                        successMsg.style.display = 'block';

                        setTimeout(() => {
                            window.location.href = 'struts-demo-welcome.html';
                        }, 1500);

                    } else {
                        addLog('WARN', `❌ 用户 ${username} 登录失败：用户名或密码错误`);
                        showError('用户名或密码错误，请重新输入');
                        resetButton();
                    }
                }, 800);

            }, 300);
        }

        function validateCredentials(username, password) {
            addLog('INFO', `验证凭证: username=${username}, password=${'*'.repeat(password.length)}`);
            return VALID_USERNAME === username && VALID_PASSWORD === password;
        }

        function showError(message) {
            const errorMsgEl = document.getElementById('errorMsg');
            errorMsgEl.textContent = message;
            errorMsgEl.style.display = 'block';
        }

        function resetButton() {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.textContent = '登 录 →';
        }

        function generateSessionId() {
            return 'SESSION-' + Math.random().toString(36).substr(2, 9).toUpperCase() + '-' + Date.now().toString(36).toUpperCase();
        }

        window.onload = function() {
            addLog('INFO', '页面加载完成');
            addLog('INFO', '等待用户输入...');
        };
    </script>
</body>
</html>
