<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | Becky's Resume</title>
    <link rel="stylesheet" href="css/error-style.css">

</head>
<body>
    <div class="container">
        <div class="typewriter-body">
            <div class="typewriter-roller"></div>
        </div>

        <div class="paper-container">
            <main class="error-content">
                <h1 class="error-code">404</h1>
                <div class="error-divider"></div>
                
                <p class="error-title">页面未找到</p>
                <p class="error-description">
                    哎呀！看起来这个页面卡在了打字机的纸带中...<br>
                    您访问的页面可能已被移除、名称更改或暂时不可用。
                </p>
                
                <div class="action-area">
                    <a href="index.html" class="home-button">⌨️ 返回主页</a>
                </div>

                <nav class="quick-links">
                    <p class="links-label">或者您可以尝试：</p>
                    <div class="links-container">
                        <a href="index.html?showSplash=false" class="nav-link">关于我</a>
                        <span class="separator">|</span>
                        <a href="projects.html" class="nav-link">项目展示</a>
                        <span class="separator">|</span>
                        <a href="index.html?showSplash=false#contact" class="nav-link">联系方式</a>
                    </div>
                </nav>

                <span class="cursor">|</span>
            </main>
        </div>
        
        <footer class="error-footer">
            <p>💡 提示：如果您认为这是一个错误，请<a href="mailto:your-email@example.com" class="footer-link">联系我们</a></p>
            <p style="margin-top: 10px; font-size: 12px; color: #999;">⌨️ 试试按键盘或点击错误代码，有惊喜哦~</p>
        </footer>

        <!-- 互动功能脚本 -->
        <script src="js/error-interactions.js?v=20250515"></script>
    </div>
</body>
</html>
